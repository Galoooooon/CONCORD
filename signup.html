<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concord — Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">CONCORD</div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="studio.html">Studio</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="signup.html" aria-current="page">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <h1>Join the Community</h1>

    <form class="site-form" onsubmit="return false;">
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Your username" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@email.com" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>

  </main>

  <footer class="site-footer">
    <span>&copy; 2026 Concord Studios. Fictional project for ITS123.</span>
    <ul>
      <li><a href="#">Twitter</a></li>
      <li><a href="#">Discord</a></li>
      <li><a href="#">Itch.io</a></li>
    </ul>
  </footer>

  <div class="chat-bubble" onclick="document.getElementById('chat-window').classList.toggle('open')">💬</div>
  <div class="chat-window" id="chat-window">
    <header>Concord Community Chat</header>
    <div class="chat-messages">
      <p><strong>JaneDev:</strong> anyone hyped for the new patch?</p>
      <p><strong>PixelFan22:</strong> yes!! release date when</p>
    </div>
    <div class="chat-input">
      <input type="text" placeholder="Type a message... (UI only)">
      <button type="button">Send</button>
    </div>
  </div>

</body>
</html>
